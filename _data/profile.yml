  Unzila is a PhD student in Biomedical Engineering at <a href = "https://nus.edu.sg/" target="_blank">National University of Singapore</a> supervised by <a href="https://cde.nus.edu.sg/bme/staff/dr-leo/" target="_blank"> Prof. LEO Hwa Liang </a> cosupervised by <a href="https://cde.nus.edu.sg/bme/staff/14828-2/" target="_blank">Dr. Wong Yoke Rung </a>.
